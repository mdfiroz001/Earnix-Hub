<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="app-page-title">Earnix - Make Money Online</title>
    
    <meta name="description" content="Best platform to earn money online by completing tasks, selling emails, and referring friends. Withdraw via Bkash and Nagad.">
    <meta name="keywords" content="earning app, make money online, bkash income, nagad income, bd earning site, gmail sell">
    <meta name="author" content="Earnix">
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://earningapp.vercel.app/">
    <meta property="og:title" content="Earnix - Best Income Source">
    <meta property="og:description" content="Start earning today with trusted payments.">
    <meta property="og:image" content="https://iili.io/qHc77Cg.md.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Earnix App Logo">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@EarnixApp">
    <meta name="twitter:title" content="Earnix - Best Income Source">
    <meta name="twitter:description" content="Start earning today with trusted payments.">
    <meta name="twitter:image" content="https://iili.io/qHc77Cg.md.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" sizes="32x32" href="https://i.ibb.co/F1nGQ9S/20260213-152600.jpg">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="https://iili.io/qHu8A0P.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/dN824sJ/20260213-152600.jpg">
    <link rel="manifest" href="/manifest.json">

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 sidebar-gradient transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-40 flex flex-col shadow-2xl">
            <div class="h-24 flex items-center px-8 border-b border-indigo-800/50">
                <div class="w-10 h-10 rounded-xl overflow-hidden mr-3 border-2 border-white/20">
                    <img id="sidebar-logo" src="https://iili.io/qHc77Cg.md.jpg" class="app-icon-img">
                </div>
                <h1 id="sidebar-title" class="text-white font-bold text-xl tracking-wide">Earnix</h1>
            </div>

            <div class="p-6">
                <div class="flex items-center space-x-4 bg-white/5 p-4 rounded-2xl border border-white/10 cursor-pointer hover:bg-white/10 transition" onclick="app.nav('profile')">
                    <img id="sidebar-avatar" src="https://iili.io/qHc77Cg.md.jpg" class="w-12 h-12 rounded-full border-2 border-indigo-400 object-cover">
                    <div class="overflow-hidden">
                        <p id="sidebar-name" class="text-white font-semibold truncate">Guest</p>
                        <p id="sidebar-status" class="text-xs text-gray-400">Not Logged In</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 px-4 overflow-y-auto space-y-2 mt-2">
                <a href="#" class="nav-item active" onclick="app.nav('dashboard')" data-page="dashboard"><i class="fas fa-home w-8"></i> <span data-i18n="dashboard">Dashboard</span></a>
                <a href="#" class="nav-item" onclick="app.nav('my_job')" data-page="my_job"><i class="fas fa-briefcase w-8"></i> <span data-i18n="task">Task</span></a>
                <a href="#" class="nav-item" onclick="app.nav('gift_code')" data-page="gift_code"><i class="fas fa-gift w-8"></i> <span data-i18n="gift_code">Gift Code</span></a>
                <a href="#" class="nav-item" onclick="app.nav('premium_plan')" data-page="premium_plan"><i class="fas fa-crown w-8"></i> <span data-i18n="plan">Plan</span></a>
                <a href="#" class="nav-item" onclick="app.nav('payment')" data-page="payment"><i class="fas fa-wallet w-8"></i> <span data-i18n="withdraw">Withdraw</span></a>
                <a href="#" class="nav-item" onclick="app.nav('history')" data-page="history"><i class="fas fa-history w-8"></i> <span data-i18n="history">History</span></a>
                <a href="#" class="nav-item" onclick="app.nav('profile')" data-page="profile"><i class="fas fa-user-circle w-8"></i> <span data-i18n="profile">Profile</span></a>
                <a href="#" class="nav-item" onclick="app.nav('rules')" data-page="rules"><i class="fas fa-gavel w-8"></i> <span data-i18n="rules">Rules</span></a>
                <a href="#" class="nav-item" onclick="app.nav('privacy_policy')" data-page="privacy_policy"><i class="fas fa-user-shield w-8"></i> <span data-i18n="privacy_policy">Privacy Policy</span></a>
                
                <div class="mt-8 border-t border-indigo-800/50 pt-4">
                    <a href="#" id="auth-btn" class="nav-item text-red-300" onclick="window.handleLogoutClick()"><i class="fas fa-sign-in-alt w-8"></i> <span data-i18n="login">Login</span></a>
                </div>
            </nav>
        </aside>

        <!-- Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity" onclick="ui.toggleSidebar()"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col md:ml-72 h-full relative bg-[#f3f4f6]">
            <header class="h-16 bg-white flex items-center justify-between px-5 md:hidden z-20 shadow-sm sticky top-0">
                <button onclick="ui.toggleSidebar()" class="text-gray-600 text-xl"><i class="fas fa-bars"></i></button>
                <h2 id="header-title" class="font-bold text-gray-800 text-lg">Dashboard</h2>
                <div class="w-9 h-9 rounded-full overflow-hidden border border-gray-200" onclick="app.nav('profile')">
                    <img id="header-avatar" src="https://iili.io/qHc77Cg.md.jpg" class="w-full h-full object-cover">
                </div>
            </header>

            <main id="content-area" class="flex-1 overflow-y-auto p-5 pb-24 md:p-8 md:pb-8">
            </main>
        </div>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav" class="fixed bottom-0 w-full bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.05)] md:hidden z-30">
            <button class="bottom-nav-item" onclick="app.nav('my_job')" data-page="my_job"><i class="fas fa-briefcase text-xl mb-1"></i><span class="text-[10px]" data-i18n="task">Task</span></button>
            <button class="bottom-nav-item" onclick="app.nav('premium_plan')" data-page="premium_plan"><i class="fas fa-crown text-xl mb-1"></i><span class="text-[10px]" data-i18n="plan">Plan</span></button>
            <button class="home-btn" onclick="app.nav('dashboard')" data-page="dashboard"><i class="fas fa-home text-2xl"></i></button>
            <button class="bottom-nav-item" onclick="app.nav('payment')" data-page="payment"><i class="fas fa-wallet text-xl mb-1"></i><span class="text-[10px]" data-i18n="withdraw">Withdraw</span></button>
            <button class="bottom-nav-item" onclick="app.nav('profile')" data-page="profile"><i class="fas fa-user text-xl mb-1"></i><span class="text-[10px]" data-i18n="profile">Profile</span></button>
        </nav>
    </div>

    <!-- FAB Container -->
    <div class="fab-container">
        <div id="fab-sub-links"></div>
        <div class="fab-btn fab-main" id="supportFab" onclick="toggleFab()">
            <i class="fas fa-headset icon-main"></i>
        </div>
    </div>

    <!-- Notice Modal -->
    <div id="notice-modal" class="modal-overlay">
        <div class="modal-box relative text-center">
            <button id="notice-close-x" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            <div class="notice-icon">
                <i class="fas fa-bell"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2" id="notice-title">Notice</h3>
            <p class="text-gray-600 mb-6" id="notice-msg">...</p>
            <button id="notice-ok-btn" class="btn-primary w-full py-3 rounded-xl font-bold">OK</button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box relative">
            <button onclick="ui.closeModal('auth-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            
            <div class="text-center mb-6">
                <img id="auth-modal-logo" src="https://iili.io/qHc77Cg.md.jpg" class="w-20 h-20 rounded-full mx-auto shadow-lg border-4 border-indigo-50 mb-4 object-cover">
                <h2 id="auth-title" class="text-2xl font-bold text-gray-800" data-i18n="login_title">Login</h2>
                <div class="flex justify-center space-x-3 mt-2 text-sm text-gray-500">
                    <span onclick="window.appLang.set('en')" class="cursor-pointer hover:text-indigo-600 font-medium">English</span>
                    <span>|</span>
                    <span onclick="window.appLang.set('bn')" class="cursor-pointer hover:text-indigo-600 font-medium">বাংলা</span>
                </div>
            </div>

            <div id="auth-alert" class="hidden p-3 rounded-lg text-sm mb-4 text-center"></div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div class="input-pro p-3 rounded-xl flex items-center">
                    <i class="fas fa-envelope text-gray-400 mr-3 ml-1"></i>
                    <input type="text" id="login-input" placeholder="Email Address or Username" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="email_username_ph" required>
                </div>
                <div class="input-pro p-3 rounded-xl flex items-center">
                    <i class="fas fa-lock text-gray-400 mr-3 ml-1"></i>
                    <input type="password" id="login-pass" placeholder="Password" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="pass_ph" required>
                </div>
                <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold shadow-lg flex justify-center items-center">
                    <span class="btn-text" data-i18n="login">Login</span>
                    <div class="spinner hidden ml-2"></div>
                </button>
            </form>

            <!-- Google Login -->
            <div id="social-login-box" class="mt-4">
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase font-bold">Or</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>
                <button onclick="authHandler.googleLogin()" class="w-full mt-2 flex items-center justify-center bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-50 transition shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3">
                    <span class="text-sm">Continue with Google</span>
                </button>
            </div>

            <!-- Registration Form -->
            <form id="reg-form" class="hidden space-y-4">
                <div class="step-dots">
                    <div class="step-dot active" id="dot-1"></div>
                    <div class="step-dot" id="dot-2"></div>
                    <div class="step-dot" id="dot-3"></div>
                </div>

                <div id="step-1">
                    <div class="space-y-4">
                        <div class="input-pro p-3 rounded-xl flex items-center">
                            <i class="fas fa-id-card text-gray-400 mr-3 ml-1"></i>
                            <input type="text" id="reg-name" placeholder="Full Name" maxlength="25" minlength="3" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="full_name_ph">
                        </div>
                        <div class="input-pro p-3 rounded-xl flex items-center">
                            <i class="fas fa-user-tag text-gray-400 mr-3 ml-1"></i>
                            <input type="text" id="reg-username" placeholder="Username (Unique)" maxlength="20" minlength="5" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="username_ph">
                        </div>
                        <button type="button" onclick="authHandler.nextStep(2)" class="btn-primary w-full py-3.5 rounded-xl font-bold" data-i18n="next">Next</button>
                    </div>
                </div>

                <div id="step-2" class="hidden">
                    <div class="space-y-4">
                        <div class="input-pro p-3 rounded-xl flex items-center">
                            <i class="fas fa-envelope text-gray-400 mr-3 ml-1"></i>
                            <input type="email" id="reg-email" placeholder="Email Address" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="email_ph" required>
                        </div>
                        <div class="input-pro p-3 rounded-xl flex items-center">
                            <i class="fas fa-gift text-gray-400 mr-3 ml-1"></i>
                            <input type="text" id="reg-ref" placeholder="Referral Code (Optional)" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="ref_ph">
                        </div>
                        <div class="flex space-x-2">
                            <button type="button" onclick="authHandler.nextStep(1)" class="w-1/3 py-3.5 bg-gray-200 text-gray-700 rounded-xl font-bold" data-i18n="back">Back</button>
                            <button type="button" onclick="authHandler.nextStep(3)" class="w-2/3 btn-primary py-3.5 rounded-xl font-bold" data-i18n="next">Next</button>
                        </div>
                    </div>
                </div>

                <div id="step-3" class="hidden">
                    <div class="space-y-4">
                        <div class="input-pro p-3 rounded-xl flex items-center">
                            <i class="fas fa-lock text-gray-400 mr-3 ml-1"></i>
                            <input type="password" id="reg-pass" placeholder="Password (Min 6 chars)" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="pass_ph" required>
                        </div>
                        <div class="input-pro p-3 rounded-xl flex items-center">
                            <i class="fas fa-check-circle text-gray-400 mr-3 ml-1"></i>
                            <input type="password" id="reg-confirm" placeholder="Confirm Password" class="bg-transparent w-full focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="confirm_ph" required>
                        </div>
                        <div class="flex space-x-2">
                            <button type="button" onclick="authHandler.nextStep(2)" class="w-1/3 py-3.5 bg-gray-200 text-gray-700 rounded-xl font-bold" data-i18n="back">Back</button>
                            <button type="submit" class="w-2/3 btn-primary py-3.5 rounded-xl font-bold flex justify-center items-center">
                                <span class="btn-text" data-i18n="create_acc_btn">Create Account</span>
                                <div class="spinner hidden ml-2"></div>
                            </button>
                        </div>
                    </div>
                </div>
            </form>

            <div class="mt-6 text-center text-sm">
                <p id="switch-txt" class="text-gray-500">
                    <span data-i18n="no_account">Don't have an account?</span> 
                    <button onclick="authHandler.toggleMode()" class="text-indigo-600 font-bold hover:underline" data-i18n="register_link">Register</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Generic Modal -->
    <div id="gen-modal" class="modal-overlay">
        <div class="modal-box relative">
            <button onclick="ui.closeModal('gen-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            <div id="gen-modal-content"></div>
        </div>
    </div>

    <!-- Gmail Rules Modal -->
    <div id="gmail-rules-modal" class="modal-overlay">
        <div class="modal-box relative">
            <button onclick="ui.closeGmailRules()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            <div class="text-center mb-4">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fas fa-book-open"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800" data-i18n="gmail_rule_title">Rules & Regulations</h3>
            </div>
            <div class="scrollable-content mb-6 text-sm text-gray-600 text-left">
                <p data-i18n="gmail_rule_desc"></p>
            </div>
            <button onclick="ui.closeGmailRules(true)" class="btn-primary w-full py-3 rounded-xl font-bold" data-i18n="i_understand">I Understand</button>
        </div>
    </div>

    <!-- Profile Edit Modal -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-box relative">
            <button onclick="ui.closeModal('profile-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            <div class="text-center mb-6">
                <h3 class="text-xl font-bold text-gray-800" data-i18n="edit_profile">Edit Profile</h3>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase" data-i18n="full_name_ph">Full Name</label>
                    <input type="text" id="modal-edit-fullname" maxlength="25" minlength="3" class="bg-transparent w-full p-3 input-pro rounded-xl focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="full_name_ph">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase" data-i18n="username_ph">Username</label>
                    <input type="text" id="modal-edit-username" maxlength="20" minlength="5" class="bg-transparent w-full p-3 input-pro rounded-xl focus:outline-none text-gray-700 text-sm" data-i18n-placeholder="username_ph">
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="ui.closeModal('profile-modal')" class="flex-1 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold" data-i18n="cancel">Cancel</button>
                    <button onclick="window.saveProfileModal()" class="flex-1 py-3 btn-primary rounded-xl font-bold" data-i18n="save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
